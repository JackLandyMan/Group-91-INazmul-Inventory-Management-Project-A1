
name: Run Pytest on Inventory Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pytest:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # Clone repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: inventory-management/requirements.txt

      # Install dependencies
      - name: Install Dependencies
        working-directory: ./inventory-management
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # Install Playwright browser
      - name: Install Playwright Chromium
        working-directory: ./inventory-management
        run: python -m playwright install --with-deps chromium

      # Start Flask application
      - name: Start Flask App
        working-directory: ./inventory-management
        run: |
          python run.py &
          for i in {1..10}; do
            if curl -s http://127.0.0.1:5000/ui/products > /dev/null; then
              echo "Flask application is running"
              exit 0
            fi
            sleep 2
          done
          echo "Flask application failed to start"
          exit 1

      # Run pytest with coverage
      - name: Run Pytest
        working-directory: ./inventory-management
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90
