name: Run Pytest on Inventory Tests
on:
  push:
    paths:
      - 'inventory-management/tests/**'
  pull_request:
    paths:
      - 'inventory-management/tests/**'

jobs:
  pytest:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # clone
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Install pytest, coverage
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Run pytest targeting tests
      - name: Run Pytest
        working-directory: ./inventory-management
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90
